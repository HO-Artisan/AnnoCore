plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

neoForge {
    version = '21.1.219'
}

repositories {
    mavenCentral()
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
}

dependencies {
    // compileOnly: this is an optional add-on library, not a runnable mod. Consumers bring
    // their own Architectury API version. transitive = false keeps Architectury's own pinned
    // dependencies out of our resolution.
    compileOnly("dev.architectury:architectury-neoforge:${project.architectury_neoforge_version}") {
        transitive = false
    }

    api project(':anno-core')
    api project(':anno-mod-common')
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'KessokuMaven'
            url = version.toString().endsWith('-SNAPSHOT')
                    ? 'https://maven.kessokuteatime.work/snapshots'
                    : 'https://maven.kessokuteatime.work/releases'
            credentials {
                username = System.getenv('K_MAVEN_USERNAME')
                password = System.getenv('K_MAVEN_TOKEN')
            }
        }
    }
}
